
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentFlow - Advanced Rent Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            transition: font-size 0.2s ease, background-color 0.2s ease;
        }

        /* Accessibility: Font Size Variations */
        [data-font-size="normal"] { font-size: 16px; }
        [data-font-size="large"] { font-size: 18px; }
        [data-font-size="xlarge"] { font-size: 20px; }

        /* Accessibility: High Contrast Mode */
        [data-contrast="high"] body {
            background-color: #ffffff !important;
        }
        [data-contrast="high"] .text-slate-500 {
            color: #334155 !important;
        }
        [data-contrast="high"] .bg-slate-50 {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
        }
        [data-contrast="high"] .border-slate-100, 
        [data-contrast="high"] .border-slate-200 {
            border-color: #94a3b8 !important;
        }

        /* Scrollbar Styling */
        .custom-scrollbar::-webkit-scrollbar {
          width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #e2e8f0;
          border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: #cbd5e1;
        }

        /* Improved Focus States for Keyboard Navigation */
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
          outline: 3px solid #4f46e5;
          outline-offset: 2px;
        }
    </style>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                inter: ['Inter', 'sans-serif'],
              },
              animation: {
                'slide-in': 'slideIn 0.3s ease-out forwards',
                'bounce-slow': 'bounce 3s infinite',
              },
              keyframes: {
                slideIn: {
                  '0%': { transform: 'translateX(100%)', opacity: '0' },
                  '100%': { transform: 'translateX(0)', opacity: '1' },
                },
              },
            },
          },
        }
    </script>
